[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src/digitalsreeni_image_annotator
    --cov-report=term-missing
    --cov-report=html
    # Coverage floor (issue #77). Set at the level the suite actually reaches,
    # deliberately not an aspirational number: a gate that fails on day one is
    # a gate that gets disabled on day two. Raise it when real coverage rises.
    --cov-fail-under=58
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI tests
    slow: Slow running tests
